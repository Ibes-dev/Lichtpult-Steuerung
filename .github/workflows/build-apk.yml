name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dmxc_version:
        description: "DMXControl-Network-Interface-Tag (muss zur installierten DMXControl-Version passen)"
        default: "v3.3.2"

permissions:
  contents: write   # für das Anlegen des GitHub-Releases bei Tags

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      PROTO_VERSION: ${{ github.event.inputs.dmxc_version || 'v3.3.2' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Protos laden
        run: bash ./setup-protos.sh "$PROTO_VERSION"

      - name: Tests + Debug-APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug -PbuildNumber=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Signierte Release-APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease -PbuildNumber=${{ github.run_number }}
          # Signatur prüfen, sonst Abbruch
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Release ohne Schlüssel verhindern
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 == ''
        run: |
          echo "Für ein Release müssen die Secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD gesetzt sein."
          exit 1

      - name: GitHub-Release anlegen
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        run: |
          cp app/build/outputs/apk/release/app-release.apk "LichtpultRemote-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "LichtpultRemote-${GITHUB_REF_NAME}.apk" \
            --title "Lichtpult Remote ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
