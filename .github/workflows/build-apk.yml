name: Build APK

on:
  push:
  workflow_dispatch:
    inputs:
      dmxc_version:
        description: "DMXControl-Network-Interface-Tag (muss zur installierten DMXC3-Version passen)"
        default: "v3.3.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Protos laden
        run: bash ./setup-protos.sh "${{ github.event.inputs.dmxc_version || 'v3.3.2' }}"

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DMXC3Remote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
