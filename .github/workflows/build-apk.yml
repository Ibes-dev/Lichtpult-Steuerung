name: Build APK

on:
  push:
  workflow_dispatch:
    inputs:
      dmxc_version:
        description: "DMXControl-Network-Interface-Tag (muss zur installierten DMXC3-Version passen)"
        default: "v3.3.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Protos laden
        run: bash ./setup-protos.sh "${{ github.event.inputs.dmxc_version || 'v3.3.2' }}"

      - name: Tests + Debug-APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug -PbuildNumber=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: DMXC3Remote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Signierte Release-APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease -PbuildNumber=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: DMXC3Remote-release-apk
          path: app/build/outputs/apk/release/app-release.apk
